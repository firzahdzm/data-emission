subnet_id: 56

polling:
  interval_minutes: 72
  request_interval_seconds: 15
  run_on_startup: true

database:
  path: data/emissions.db

web:
  host: 127.0.0.1
  port: 8000

# Each entry under `hotkeys` is one wallet. The mapping form carries the
# owning coldkey and a label ("I", "II", "(old)") — several wallets belong
# to one person, and the label is how they are told apart, including which
# rotation era a wallet comes from. The bare-string form is still accepted
# for a wallet whose coldkey is unknown.
#
# All of a person's wallets accumulate under that one person name, so a
# pre-rotation hotkey that is still earning keeps counting toward the same
# per-period total as their new ones.
team:
  - name: ExamplePerson
    hotkeys:
      - hotkey: 5BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB1
        coldkey: 5CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC1
        label: I
      - hotkey: 5BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB2
        coldkey: 5CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC2
        label: II
      - 5BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB3   # coldkey unknown

# Usernames (must match the Basic-Auth username forwarded by nginx via
# X-Remote-User) that are allowed to Close / Delete settlements. Leave
# the list empty if nobody should have admin powers.
admin_users:
  - replace-with-your-htpasswd-username

# Tournament buy-ins. These drive the dashboard's arithmetic and its
# balance check; the signer holds its own authoritative copy and ignores
# this one.
tournament:
  address: 5Ef5JgNv14LY4UEQFHbRQkf8TnegDV3AfAbcsJe5T2w6VQdo
  fees_tao:
    text: 0.7
    image: 0.4
    env: 0.6

signer_socket: /run/emission-signer/emission-signer.sock
